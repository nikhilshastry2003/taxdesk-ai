[project]
name = "taxdesk"
version = "0.1.0"
description = "Local first compliance command center for tax practitioners."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Repo root on sys.path so tests can import the database package.
pythonpath = ["."]
testpaths = ["tests"]
