[project]
name = "taxdesk"
version = "0.1.0"
description = "Local first compliance command center for tax practitioners."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Repo root on sys.path so tests can import the database package.
pythonpath = ["."]
testpaths = ["tests"]
