[project]
name = "taxdesk"
version = "0.3.0"
description = "Local first compliance command center for a small tax practice."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.140.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# Repo root on sys.path so tests can import the app package.
pythonpath = ["."]
testpaths = ["tests"]
